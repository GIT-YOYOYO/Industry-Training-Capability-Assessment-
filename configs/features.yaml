# ============================================================================
# 特征清单：进模型的列的唯一来源。代码只从这里取列。
# 每条“禁用”都写清理由，检查时老师会随便挑一列问“它为什么能/不能进模型”。
# ============================================================================
groups:
  # 培训开始前就可获得的 5 个基线测评维度（连续，已标准化）
  numeric:
    - x1
    - x2
    - x3
    - x4
    - x5

excluded:
  stuid: "学员标识符，无预测意义，作为特征会引入个体记忆而非泛化"
  schoolid: "培训中心标识符；按中心分组切分后测试集中心训练时不可见，且是分组键"
  schooltype: "机构类型；为避免按机构类型系统性差别对待，未入模（ADR-002）"
  x: "x1–x5 的确定性线性组合（R²≈0.99999999），入模只引入共线性与冗余（ADR-003）"
  y1: "目标 y 的成分（y 由 y1–y5 线性组合，R²≈0.99），目标泄漏，禁用"
  y2: "目标 y 的成分，目标泄漏，禁用"
  y3: "目标 y 的成分，目标泄漏，禁用"
  y4: "目标 y 的成分，目标泄漏，禁用"
  y5: "目标 y 的成分，目标泄漏，禁用"
  y: "标签来源列，禁止作为特征"