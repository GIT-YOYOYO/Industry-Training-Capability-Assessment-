[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vocational-training-ability"
version = "0.1.0"
description = "职业技术培训能力不达标风险筛选：可复现、可检查、可解释的二分类项目"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "学员" }]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "pyarrow>=16.0",
  "openpyxl>=3.1.5",
  "joblib>=1.6.0",
]

[project.scripts]
vtrain = "vtrain.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "pandas-stubs>=3.1.0.261029",
  "pytest-cov>=7.1.0",
  "import-linter>=2.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vtrain"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "B011"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]
warn_unused_ignores = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["lightgbm.*", "lightgbm", "sklearn.*", "joblib.*", "joblib"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "unit: 纯函数单元测试",
  "acceptance: 验收测试（规则与契约）",
  "e2e: 端到端冒烟",
]

[tool.coverage.run]
source = ["vtrain"]

[tool.coverage.report]
fail_under = 85
skip_empty = true
